# SLAM Toolbox configuration for lifelong mapping.
#
# The mapper subscribes to the filtered LiDAR scan and publishes:
#   - /map (nav_msgs/OccupancyGrid)
#   - /map_metadata
#   - map -> odom TF
#
# slam_toolbox "lifelong" mode keeps a full graph of past robot poses,
# which lets the exploration layer query the whole trajectory and lets
# the map recover from loop closures without discarding prior evidence.

slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_filtered
    use_scan_matching: true
    use_scan_barycenter: true

    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.5
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    transform_publish_period: 0.05
    map_update_interval: 5.0
    resolution: 0.05

    use_scan_barycenter: true
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_maximum_variance_fine: 1.0

    max_laser_range: 15.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    mode: mapping
    lifelong:
      min_score: 0.0
      merge_rate: 0.6
      scale: 1.0
