# ros2_control configuration loaded by the gazebo_ros2_control plugin.
# The diff_drive_controller publishes /cmd_vel subscriptions -> wheel joint
# velocities, and produces odometry on /odom with TF odom -> base_link.

robot_autonomy:
  ros2_control:
    hardware:
      - type: gazebo_ros2_control/GazeboSystem
    joints:
      - left_wheel_joint
      - right_wheel_joint

  diff_drive_controller:
    type: diff_drive_controller/DiffDriveController
    parameters:
      left_wheel_names: ["left_wheel_joint"]
      right_wheel_names: ["right_wheel_joint"]

      wheel_separation: 0.32
      wheel_radius: 0.10

      publish_rate: 50.0
      pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.001]
      twist_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.001]

      open_loop: false
      enable_odom_tf: true

      # Match the kinematic limits declared in properties.xacro.
      linear.x.max_velocity: 1.2
      linear.x.max_acceleration: 1.0
      linear.x.max_jerk: 5.0
      angular.z.max_velocity: 1.5
      angular.z.max_acceleration: 2.0
      angular.z.max_jerk: 10.0

      cmd_vel_timeout: 0.5
