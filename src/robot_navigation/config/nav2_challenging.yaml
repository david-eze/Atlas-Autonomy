# Nav2 configuration profile: challenging environment
#
# Extends nav2_office.yaml. The environment has narrow passages, dead
# ends, clutter, and areas with poor LiDAR visibility, so the profile
# trades speed for reliability:
#   * conservative speed + inflation so tight passages stay navigable
#   * more AMCL particles to survive poor observability
#   * collision monitor threshold reduced to avoid false trips in clutter

amcl:
  ros__parameters:
    max_particles: 4000
    min_particles: 1000
    update_min_a: 0.1
    update_min_d: 0.15
    do_beamskip: true
    beam_skip_threshold: 0.5

controller_server:
  ros__parameters:
    controller_frequency: 30.0
    FollowPath:
      RegulatedPurePursuitController:
        desired_linear_vel: 0.4
        lookahead_dist: 0.5
        min_lookahead_dist: 0.25
        max_lookahead_dist: 0.8
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 1.5
        use_regulated_linear_velocity_scaling: true
        allow_reversing: true
        regulated_linear_scaling_min_radius: 0.8
        regulated_linear_scaling_min_speed: 0.15

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 3.0
      width: 3.5
      height: 3.5
      inflation_layer:
        inflation_radius: 0.4
        cost_scaling_factor: 4.5
      obstacle_layer:
        scan:
          obstacle_max_range: 2.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      inflation_layer:
        inflation_radius: 0.5
        cost_scaling_factor: 4.5

planner_server:
  ros__parameters:
    GridBased:
      tolerance: 0.3
      use_astar: true
      allow_unknown: false

velocity_smoother:
  ros__parameters:
    max_velocity: [0.8, 0.0, 1.2]
    min_velocity: [-0.8, 0.0, -1.2]
    max_accel: [0.8, 0.0, 1.6]
    max_decel: [0.8, 0.0, 1.6]
    min_accel: [-0.8, 0.0, -1.6]
    min_decel: [-0.8, 0.0, -1.6]

collision_monitor:
  ros__parameters:
    scan_source:
      min_obstacle_distance: 0.22
      polygon_padding: 0.1
      min_points: 3

behavior_server:
  ros__parameters:
    behavior_plugins: ["spin", "backup", "wait"]
    backup:
      speed: 0.15
      distance: 0.3
    spin:
      angular_dist: 1.5708
      time_allowance: 10.0
