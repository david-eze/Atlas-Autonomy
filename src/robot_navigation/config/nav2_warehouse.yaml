# Nav2 configuration profile: warehouse environment
#
# Extends nav2_office.yaml. Differences:
#   * Narrow aisles -> tighter inflation, smaller robot footprint assumption.
#   * Shelves create long straight corridors -> higher cruise speed.
#   * Dynamic carts are common -> faster local costmap updates.

amcl:
  ros__parameters:
    max_particles: 3000
    min_particles: 700
    update_min_a: 0.15
    update_min_d: 0.2

bt_navigator:
  ros__parameters: {}

controller_server:
  ros__parameters:
    controller_frequency: 25.0
    FollowPath:
      RegulatedPurePursuitController:
        desired_linear_vel: 0.8
        lookahead_dist: 0.7
        min_lookahead_dist: 0.35
        max_lookahead_dist: 1.2
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 0.8

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 4.0
      width: 4
      height: 4
      inflation_layer:
        inflation_radius: 0.45
        cost_scaling_factor: 4.0
      obstacle_layer:
        scan:
          obstacle_max_range: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      inflation_layer:
        inflation_radius: 0.6
        cost_scaling_factor: 4.0

velocity_smoother:
  ros__parameters:
    max_velocity: [1.2, 0.0, 1.5]
    min_velocity: [-1.2, 0.0, -1.5]
    max_accel: [1.2, 0.0, 2.4]
    max_decel: [1.2, 0.0, 2.4]
    min_accel: [-1.2, 0.0, -2.4]
    min_decel: [-1.2, 0.0, -2.4]

collision_monitor:
  ros__parameters:
    scan_source:
      min_obstacle_distance: 0.25
      polygon_padding: 0.15
